[project]
name = "qinglong-script"
version = "0.1.0"
description = "My Qinglong Script"
authors = [{ name = "Ryliey" }]
requires-python = "~=3.12.0"
readme = "README.md"
license = "GPL-3.0"
dependencies = [
    "curl-cffi>=0.14.0",
    "httpx>=0.28.1",
    "requests>=2.32.3,<3",
    "selectolax>=0.3.31",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
